name: Refresh MedPath jobs and publish website
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "19 14,20 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "medpath-pages"
  cancel-in-progress: false
jobs:
  collect_and_publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh public job listings
        run: python scripts/collect_jobs.py
      - name: Save updated public listing data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/jobs.json seen_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public medical jobs"
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
